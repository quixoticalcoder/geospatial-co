[project]
name = "geospatial-co"
version = "0.1.0"
description = "geospatial-co: explainable location scoring with H3 and LangGraph"
requires-python = ">=3.11"
dependencies = [
    # FastAPI + server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",

    # Pydantic + settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # LangGraph + LangChain
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # H3 spatial indexing
    "h3>=3.7.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
geospatial-co = "cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "llm*", "agents*", "tools*", "scoring*", "models*", "api*"]
